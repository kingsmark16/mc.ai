# Build and deploy the MC.AI NestJS backend to Azure App Service.
# The repository is a monorepo, so all Node commands run from backend/.

name: Build and deploy MC.AI backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mc-ai-api
  BACKEND_PATH: backend
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, build, test, and prune backend
        working-directory: ${{ env.BACKEND_PATH }}
        run: |
          npm ci
          npm run build
          npm test
          npm prune --omit=dev

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-ai-backend
          path: ${{ env.BACKEND_PATH }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-ai-backend
          path: backend

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_74F48140D37F44B493C6FB62FF0B6681 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F4DF70A43974B1684D8721C93DEB743 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D7CBE49AEE994CE8941711A3D1B2280D }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: backend
